# Success
- case: valid_cred_key_is_accepted
  description: get_credentials should accept a valid Literal key
  main: |
    from typing import Literal
    from types import MappingProxyType
    from ocarina.opinionated.infra.env import EnvGetters, ImmutableCredentials

    type CredKeys = Literal["intranet", "api"]
    type ValueKeys = Literal["fullname"]

    env: EnvGetters[CredKeys, ValueKeys] = EnvGetters(
        credentials={
            "intranet": MappingProxyType({"login": "a", "password": "b"}),
            "api": MappingProxyType({"login": "c", "password": "d"}),
        },
        values={"fullname": "John Doe"},
    )
    env.get_credentials("intranet")
    env.get_credentials("api")

