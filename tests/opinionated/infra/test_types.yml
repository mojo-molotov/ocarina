- case: tkeys_inferred_from_factory_return_type
  description: TCredKeys and TValueKeys should be inferred from factory return type annotation
  regex: true
  main: |
    from typing import Literal
    from types import MappingProxyType
    from ocarina.opinionated.infra.env import EnvGetters

    type CredKeys = Literal["intranet", "api"]
    type ValueKeys = Literal["fullname"]

    def create_env() -> EnvGetters[CredKeys, ValueKeys]:
        return EnvGetters(
            credentials={
                "intranet": MappingProxyType({"login": "a", "password": "b"}),
                "api": MappingProxyType({"login": "c", "password": "d"}),
            },
            values={"fullname": "John Doe"},
        )

    env = create_env()
    reveal_type(env)  # N: Revealed type is .*EnvGetters\[.*intranet.*api.*fullname.*\].*

# Failure
- case: invalid_cred_key_is_rejected
  description: get_credentials should reject a key not in Literal
  regex: true
  main: |
    from typing import Literal
    from types import MappingProxyType
    from ocarina.opinionated.infra.env import EnvGetters

    type CredKeys = Literal["intranet", "api"]

    env: EnvGetters[CredKeys, str] = EnvGetters(
        credentials={
            "intranet": MappingProxyType({"login": "a", "password": "b"}),
            "api": MappingProxyType({"login": "c", "password": "d"}),
        },
    )
    env.get_credentials("unknown")
  out: |
    main:13: error: .* incompatible type .*

