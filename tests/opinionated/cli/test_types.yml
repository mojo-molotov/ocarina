# Success
- case: valid_key_accepted_on_set
  description: set() should accept a valid Literal key
  main: |
    from typing import Literal
    from ocarina.dsl.invariants.assertions import is_positive
    from ocarina.opinionated.cli.store import CliStore, field

    type MyKeys = Literal["workers", "timeout"]

    store: CliStore[MyKeys] = CliStore(
        fields={
            "workers": field(validate=lambda chain: chain.assert_that(is_positive)),
            "timeout": field(validate=lambda chain: chain.assert_that(is_positive)),
        }
    )
    store.set("workers", 4)
    store.set("timeout", 30)

